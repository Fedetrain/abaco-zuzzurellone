<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abaco Zuzzurellone — test della logica</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 2rem 1.2rem 4rem;
    font: 15px/1.6 ui-monospace, 'JetBrains Mono', Consolas, monospace;
    background: #f2ede3; color: #17130f;
    max-width: 56rem; margin-inline: auto;
  }
  @media (prefers-color-scheme: dark) { body { background: #100e0c; color: #f3ece1; } }
  h1 { font-size: 1.3rem; margin: 0 0 .3rem; }
  p.sub { margin: 0 0 1.6rem; opacity: .6; font-size: .82rem; }
  #summary { font-size: 1.05rem; font-weight: 700; padding: .8rem 1rem; border-radius: 12px; margin-bottom: 1.2rem; }
  #summary.ok   { background: rgba(31,122,86,.14);  color: #1f7a56; }
  #summary.fail { background: rgba(217,60,34,.14);  color: #d93c22; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .3rem; }
  li { padding: .5rem .8rem; border-radius: 9px; background: rgba(127,127,127,.09); font-size: .82rem; }
  li.pass::before { content: 'PASS'; color: #1f7a56; font-weight: 700; margin-right: .8rem; }
  li.fail::before { content: 'FAIL'; color: #d93c22; font-weight: 700; margin-right: .8rem; }
  li.fail { background: rgba(217,60,34,.12); }
  li .msg { display: block; margin-left: 3.6rem; opacity: .75; font-size: .78rem; }
</style>
</head>
<body>
  <h1>Abaco Zuzzurellone — test della logica</h1>
  <p class="sub">collation italiana · codec del dizionario · ricerca binaria · conteggi · risposte incoerenti · punteggio a tempo</p>
  <div id="summary">esecuzione…</div>
  <ul id="list"></ul>

  <script src="data/dizionario.js"></script>
  <script src="assets/core.js"></script>
  <script src="tests.js"></script>
  <script>
    (function () {
      var res = window.AZ_TESTS.results;
      var failed = res.filter(function (r) { return !r.ok; }).length;
      var list = document.getElementById('list');
      res.forEach(function (r) {
        var li = document.createElement('li');
        li.className = r.ok ? 'pass' : 'fail';
        li.textContent = r.name;
        if (!r.ok) {
          var m = document.createElement('span');
          m.className = 'msg';
          m.textContent = r.message;
          li.appendChild(m);
        }
        list.appendChild(li);
      });
      var sum = document.getElementById('summary');
      sum.className = failed ? 'fail' : 'ok';
      sum.textContent = (res.length - failed) + '/' + res.length + ' test superati' +
        (failed ? ' — ' + failed + ' falliti' : ' — tutto a posto');
      document.title = (failed ? 'FAIL ' : 'OK ') + document.title;
    })();
  </script>
</body>
</html>
